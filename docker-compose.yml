# All LISTNUN_* env variables also support the LISTNUN_*_FILE pattern for loading secrets from files with Docker secrets and Podman
# eg: LISTNUN_ADMIN_USER -> LISTNUN_ADMIN_USER_FILE=/path/to/file_with_value

x-db-credentials: &db-credentials                             # Use the default POSTGRES_ credentials if they're available or simply default to "listnun"
  POSTGRES_USER: &db-user listnun                            # for database user, password, and database name
  POSTGRES_PASSWORD: &db-password listnun
  POSTGRES_DB: &db-name listnun

services:
  # listnun app
  app:
    image: listnun/listnun:latest
    container_name: listnun_app
    restart: unless-stopped
    ports:
      - "9000:9000"                                           # To change the externally exposed port, change to: $custom_port:9000
    networks:
      - listnun
    hostname: listnun.example.com                            # Recommend using FQDN for hostname
    depends_on:
      - db
    command: [sh, -c, "./listnun --install --idempotent --yes --config '' && ./listnun --upgrade --yes --config '' && ./listnun --config ''"]
                                                              # --config (file) param is set to empty so that listnun only uses the env vars (below) for config.
                                                              # --install --idempotent ensures that DB installation happens only once on an empty DB, on the first ever start.
                                                              # --upgrade automatically runs any DB migrations when a new image is pulled.

    environment:                                              # The same params as in config.toml are passed as env vars here.
      LISTNUN_app__address: 0.0.0.0:9000
      LISTNUN_db__user: *db-user
      LISTNUN_db__password: *db-password
      LISTNUN_db__database: *db-name
      LISTNUN_db__host: db
      LISTNUN_db__port: 5432
      LISTNUN_db__ssl_mode: disable
      LISTNUN_db__max_open: 25
      LISTNUN_db__max_idle: 25
      LISTNUN_db__max_lifetime: 300s
      TZ: Etc/UTC
      LISTNUN_ADMIN_USER: ${LISTNUN_ADMIN_USER:-}           # If these (optional) are set during the first `docker compose up`, then the Super Admin user is automatically created.
      LISTNUN_ADMIN_PASSWORD: ${LISTNUN_ADMIN_PASSWORD:-}   # Otherwise, the user can be setup on the web app after the first visit to http://localhost:9000
    volumes:
      - ./uploads:/listnun/uploads:rw                        # Mount an uploads directory on the host to /listnun/uploads inside the container.
                                                              # To use this, change directory path in Admin -> Settings -> Media to /listnun/uploads

  # Postgres database
  db:
    image: postgres:17-alpine
    container_name: listnun_db
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"                                 # Only bind on the local interface. To connect to Postgres externally, change this to 0.0.0.0
    networks:
      - listnun
    environment:
      <<: *db-credentials
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U listnun"]
      interval: 10s
      timeout: 5s
      retries: 6
    volumes:
      - type: volume
        source: listnun-data
        target: /var/lib/postgresql/data

networks:
  listnun:

volumes:
  listnun-data:
