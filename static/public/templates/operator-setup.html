{{ define "admin-operator-setup" }}
{{ template "auth-header" .}}
	<h1 class="auth-title">{{ .L.T "auth.newPasswordTitle" }}</h1>
	<p class="auth-sub">{{ .L.T "auth.setupHelp" }}</p>

	<form method="post" action="/admin/operator-setup" class="auth-form">
		<input type="hidden" name="token" value="{{ .Data.Token }}" />
		{{ template "auth-new-password" . }}

		{{ if .Data.Error }}<p class="auth-error" role="alert">{{ .Data.Error }}</p>{{ end }}

		<button class="auth-btn" type="submit">{{ .L.T "auth.saveAndSignIn" }}</button>
	</form>
{{ template "auth-footer" .}}
{{ end }}
