{{ define "admin-twofa" }}
{{ template "auth-header" .}}
	<h1 class="auth-title">{{ .L.T "users.twoFA" }}</h1>
	<p class="auth-sub">{{ .L.T "users.totpCodeHelp" }}</p>

	<form method="post" action="/admin/login/twofa" class="auth-form">
		<input type="hidden" name="token" value="{{ .Data.Token }}" />
		<input type="hidden" name="next" value="{{ .Data.NextURI }}" />

		<div class="auth-field">
			<label for="totp_code">{{ .L.T "users.totpCode" }}</label>
			<input id="totp_code" class="auth-otp" type="text" name="totp_code" inputmode="numeric" autocomplete="one-time-code"
				autofocus required pattern="[0-9]{6}" maxlength="6" placeholder="••••••" />
		</div>

		{{ if .Data.Error }}<p class="auth-error" role="alert">{{ .Data.Error }}</p>{{ end }}

		<button class="auth-btn" type="submit">{{ .L.T "globals.buttons.continue" }}</button>
	</form>
	<p class="auth-back"><a href="{{ .RootURL }}/admin/login">← {{ .L.T "auth.backToSignIn" }}</a></p>
{{ template "auth-footer" .}}
{{ end }}
