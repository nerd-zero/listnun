{{ define "admin-forgot-password" }}
{{ template "auth-header" .}}
	<h1 class="auth-title">{{ .L.T "auth.forgotTitle" }}</h1>
	<p class="auth-sub">{{ .L.T "auth.forgotHelp" }}</p>

	<form method="post" action="/admin/forgot" class="auth-form">
		<div class="auth-field">
			<label for="email">{{ .L.T "subscribers.email" }}</label>
			<input id="email" type="email" name="email" autocomplete="email" autofocus required />
		</div>

		{{ if .Data.Error }}<p class="auth-error" role="alert">{{ .Data.Error }}</p>{{ end }}

		<button class="auth-btn" type="submit">{{ .L.T "auth.sendLink" }}</button>
	</form>
	<p class="auth-back"><a href="{{ .RootURL }}/admin/login">← {{ .L.T "auth.backToSignIn" }}</a></p>
{{ template "auth-footer" .}}
{{ end }}
